plugins {
    id 'com.android.library'
}
android {
    namespace = 'com.shilapi.xcertplay.shared'
    compileSdk = 37

    defaultConfig {
        minSdk = 28
        targetSdk = 37

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }

        externalNativeBuild {
            ndkBuild {
                arguments 'APP_PLATFORM=android-28'
            }
        }

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }
    ndkVersion = '28.2.13676358'
    externalNativeBuild {
        ndkBuild {
            path = file('src/main/jni/Android.mk')
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
    testOptions {
        unitTests {
            // The JVM tests drive real code paths, and Android's stub jar throws on every Log call
            // unless the stubs are told to return defaults. Without this, a test that happens to
            // cross a logging line fails on the logger instead of on its own assertions.
            returnDefaultValues = true
        }
    }
}
dependencies {
    implementation libs.androidx.app
    implementation libs.androidx.media3.session
    implementation libs.androidx.media3.container
    implementation libs.bouncycastle
    implementation libs.concentus
    testImplementation libs.junit
}
