name: Fork debug APKs

# Fork-only build. The upstream workflow (android.yml) signs every APK with the
# project release keystore, which a fork cannot have: its "Prepare signing key"
# step exits before anything is compiled. This workflow deliberately skips all
# signing, so a personal fork can still produce installable debug APKs (signed
# with the default Android debug key) on every push and on demand.
#
# Upstream's android.yml stays untouched and strict; on this fork it is left
# disabled so it cannot produce failing runs.

on:
  push:
    branches:
      - "**"
  # Lets a build be started without pushing a commit, which is how the signing
  # secrets get exercised after they change.
  workflow_dispatch:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apks:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-37.0
            build-tools;36.0.0
            ndk;28.2.13676358

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        # Hosted runners are ephemeral, so the SDK's debug keystore is regenerated on every run and
        # each build ended up with a different signature - a new APK could never update the previous
        # one. The same fixed key is used for every build here, which makes updates installable.
        # Without the secret (any other fork) nothing is written and Gradle falls back to the
        # per-run debug key, so the build still works.
        env:
          KEYSTORE_BASE64: ${{ secrets.FORK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing key configured; falling back to the per-run debug keystore."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/xcertplay.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/xcertplay.p12" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.FORK_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=${{ secrets.FORK_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=${{ secrets.FORK_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "Signing debug APKs with the fixed key (${{ secrets.FORK_KEY_ALIAS }})."

      - name: Test and build debug APKs
        run: >-
          ./gradlew
          :shared:testDebugUnitTest
          :mobile:assembleDebug
          :automotive:assembleDebug
          --stacktrace

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: fork-debug-apks
          path: |
            mobile/build/outputs/apk/debug/*.apk
            automotive/build/outputs/apk/debug/*.apk
          if-no-files-found: error
