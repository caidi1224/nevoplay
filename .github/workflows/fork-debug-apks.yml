name: Fork debug APKs

# Fork-only build. The upstream workflow (android.yml) signs every APK with the
# project release keystore, which a fork cannot have: its "Prepare signing key"
# step exits before anything is compiled. This workflow deliberately skips all
# signing, so a personal fork can still produce installable debug APKs (signed
# with the default Android debug key) on every push and on demand.
#
# Upstream's android.yml stays untouched and strict; on this fork it is left
# disabled so it cannot produce failing runs.

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apks:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-37.0
            build-tools;36.0.0
            ndk;28.2.13676358

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build debug APKs
        # The Changan Qiyuan OpenSDK credentials are injected from repository secrets and end up in
        # the APK's manifest meta-data. They are never committed, and they are injected ONLY for a
        # manually dispatched run: this fork is public, so an APK carrying them must never be
        # produced by an ordinary push. Delete the artifact as soon as it has been downloaded.
        env:
          CA_DEV_CLIENT_ID: ${{ github.event_name == 'workflow_dispatch' && secrets.CA_DEV_CLIENT_ID || '' }}
          CA_DEV_CLIENT_SECRET: ${{ github.event_name == 'workflow_dispatch' && secrets.CA_DEV_CLIENT_SECRET || '' }}
        run: >-
          ./gradlew
          :shared:testDebugUnitTest
          :mobile:assembleDebug
          :automotive:assembleDebug
          --stacktrace

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: fork-debug-apks
          path: |
            mobile/build/outputs/apk/debug/*.apk
            automotive/build/outputs/apk/debug/*.apk
          if-no-files-found: error
